[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "itu-mcp"
version = "0.7.6.post1.dev18"
description = "MCP server for ITU Ninova, OBS, Portal, campus services and library: courses, grades, schedules, planning and more."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "yatuk" },
  { name = "tzi4" },
]
keywords = ["mcp", "model-context-protocol", "ninova", "obs", "portal", "library", "campus", "itu", "claude", "cursor"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Education",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Education",
  "Topic :: Internet :: WWW/HTTP",
  "Typing :: Typed",
]
dependencies = [
  "beautifulsoup4>=4.12.0",
  "lxml>=5.0.0",
  "mcp>=1.29.0,<2",
  "pypdf>=5,<7",
  "python-docx>=1.1.0",
  "requests>=2.32,<3",
  "starlette>=0.37.2",
  "uvicorn>=0.30.0",
  "filelock>=3.16,<4",
  "pypdfium2>=5,<6",
  "Pillow>=11,<13",
  "playwright>=1.62,<2",
]

[project.optional-dependencies]
playwright = ["playwright>=1.62,<2"]

[project.urls]
Homepage = "https://github.com/tzi4/itu-mcp-paperbridge"
Repository = "https://github.com/tzi4/itu-mcp-paperbridge"
Issues = "https://github.com/tzi4/itu-mcp-paperbridge/issues"

[project.scripts]
itu-mcp = "ninova_mcp.server:main"
itu-mcp-remote = "ninova_mcp.remote:main"
paperbridge = "paperbridge.cli:main"
paperbridge-mcp = "paperbridge.mcp_server:main"
# Back-compat aliases
ninova-mcp = "ninova_mcp.server:main"
ninova-mcp-remote = "ninova_mcp.remote:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
paperbridge = ["*.html"]
