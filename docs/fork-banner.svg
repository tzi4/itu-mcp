<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">ITU MCP + PaperBridge</title>
  <desc id="desc">Your campus. Your research. One conversation. A folded paper bridge connects campus and research. Maintained by tzi4, on your computer or server.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1"><stop stop-color="#0b1425"/><stop offset="1" stop-color="#172b40"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#68e4c5"/><stop offset="1" stop-color="#99b2ff"/></linearGradient>
    <linearGradient id="paper" x2="0.4" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#b9d6df"/></linearGradient>
    <linearGradient id="fold" x2="1" y2="1"><stop stop-color="#e3f7f1"/><stop offset="1" stop-color="#84b5c8"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#55d7be" stop-opacity=".12"/><stop offset="1" stop-color="#55d7be" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity=".025"/></pattern>
  </defs>
  <rect width="1200" height="360" rx="26" fill="url(#background)"/>
  <rect width="1200" height="360" rx="26" fill="url(#grid)"/>
  <ellipse cx="928" cy="195" rx="272" ry="170" fill="url(#glow)"/>
  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="64" y="68" font-size="13" font-weight="600" letter-spacing="2.5" fill="#68e4c5">MAINTAINED BY TZI4</text>
    <text x="62" y="144" font-size="64" font-weight="700" letter-spacing="-1.5" fill="#f4f8ff">ITU MCP</text>
    <text x="62" y="213" font-size="54" font-weight="600" letter-spacing="-1" fill="url(#accent)">+ PaperBridge</text>
    <text x="64" y="274" font-size="23" fill="#ccd7e6">Your campus. Your research. One conversation.</text>
    <text x="65" y="312" font-size="13" letter-spacing="1.8" fill="#8c9fb7">ON YOUR COMPUTER OR SERVER</text>
  </g>
